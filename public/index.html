<!doctype html><title>Sky Predict</title><style>body{margin:0;background:#f4f8fb;font:16px Arial;color:#14283e}header{background:#102c49;color:#fff;padding:18px 8%;font-size:24px;font-weight:bold}main{max-width:1050px;margin:auto;padding:25px}.box{background:#fff;border:1px solid #dbe5ee;border-radius:14px;padding:18px;margin-top:18px}.form{display:grid;grid-template-columns:2fr 1.4fr auto;gap:12px;align-items:end}label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}input,select,button{box-sizing:border-box;width:100%;padding:11px;border:1px solid #dbe5ee;border-radius:8px;font:inherit}.dates{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:5px}button{background:#1976c7;color:#fff;font-weight:bold;cursor:pointer}.hours{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.hour{padding:8px;background:#f7fafc;border-left:3px solid #1976c7;font-size:12px}.hour b,.hour time{display:block}.muted{color:#687a8e}@media(max-width:700px){.form{grid-template-columns:1fr}.hours{grid-template-columns:repeat(3,1fr)}}</style><header>Sky Predict — Free public weather</header><main><h1>India daily weather report</h1><p class="muted">No sign-in needed.</p><section class="box form"><div><label>District / location</label><input id="p" value="Trichy, Tamil Nadu"></div><div><label>Report date</label><div class="dates"><select id="d"></select><select id="m"></select><select id="y"></select></div></div><button id="go">Get report</button></section><p id="s" class="muted"></p><section class="box"><b id="w">24-HOUR OUTLOOK</b><div id="h" class="hours"></div></section></main><script>let n=new Date;for(let i=1;i<32;i++)d.add(new Option(i,i));for(let i=0;i<12;i++)m.add(new Option(new Date(2025,i,1).toLocaleString('en',{month:'short'}),i));for(let i=2025;i<2076;i++)y.add(new Option(i,i));d.value=n.getDate();m.value=n.getMonth();y.value=Math.max(2025,n.getFullYear());let icons={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',51:'🌦️',61:'🌦️',63:'🌧️',65:'🌧️',80:'🌧️',95:'⛈️'};async function load(){let q=y.value+'-'+String(+m.value+1).padStart(2,'0')+'-'+String(d.value).padStart(2,'0');s.textContent='Loading live forecast…';try{let r=await fetch('/api/weather?place='+encodeURIComponent(p.value)+'&date='+q),j=await r.json();if(!r.ok)throw Error(j.error);w.textContent=j.location.name+' · 24-HOUR OUTLOOK';h.innerHTML='';for(let i=0;i<24;i++)h.innerHTML+='<div class="hour"><time>'+String(i).padStart(2,'0')+':00</time><b>'+(icons[j.hourly.weather_code[i]]||'🌡️')+' '+Math.round(j.hourly.temperature_2m[i])+'°</b>'+j.hourly.precipitation_probability[i]+'% rain</div>';s.textContent='Updated live forecast'}catch(e){s.textContent=e.message}}go.onclick=load;load()</script>
